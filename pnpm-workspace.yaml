# Ensure only packages released at least 1 day ago can be installed.
minimumReleaseAge: 1440

nodeLinker: 'hoisted'

packages:
  - 'example'

catalog:
  '@react-native/babel-preset': 0.85.3
  '@react-native/eslint-config': 0.85.3
  '@react-native/jest-preset': 0.85.3
  react: 19.2.3
  react-native: 0.85.3
  react-native-builder-bob: 0.42.1

allowBuilds:
  msgpackr-extract: false
  react-native-audio-browser@https://codeload.github.com/MissingCore/react-native-audio-browser/tar.gz/f202a8f0acad8e1051fc70d0f31206c1851b7a8d: true
  unrs-resolver: false
